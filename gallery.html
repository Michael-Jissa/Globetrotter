    <section>
      <h1>Gallery</h1>
      <p>A quick visual tour of Lalibela's sacred architecture, living traditions, and mountain setting.</p>
    </section>

    <section class="gallery">
      <figure>
        <img src="https://ychef.files.bbci.co.uk/1280x720/p01rv3jq.jpg" alt="Rock-hewn church exterior in Lalibela" />
        <figcaption>A church carved top-down from solid rock, one of Lalibela's most famous architectural achievements.</figcaption>
      </figure>

      <figure>
        <img src="https://qiraatafrican.com/en/wp-content/uploads/2023/11/Priests-and-pilgrims-attend-the-celebration-of-Genna-the-Ethiopian-Orthodox-Christmas-Lalibela.webp" alt="Pilgrims gathered near a church in Lalibela" />
        <figcaption>Pilgrims gathering for Genna (Ethiopian Christmas), one of the biggest spiritual events in the town.</figcaption>
      </figure>

      <figure>
        <img src="https://yellowwoodadventures.com/storage/media/images/general/768_x/ethiopia-church-67bddbacdffe0.jpg" alt="Interior view of Lalibela" />
        <figcaption>Church interiors preserve painted details and sacred spaces that reflect centuries of worship.</figcaption>
      </figure>

      <figure>
        <img src="https://miro.medium.com/v2/resize:fit:1400/1*mTbtFGQ5EHux_zUegfXxGQ.png" alt="Connection of churches in Lalibela" />
        <figcaption>Trenches and passageways connect Lalibela's 11 churches into one symbolic sacred landscape.</figcaption>
      </figure>

      <figure>
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTST06ytpZKcNHd5db_Q60hHOA4NX3jviYJtg&s" alt="Christmas night in Lalibela" />
        <figcaption>Night prayers at Bete Giyorgis show why Lalibela is both a heritage site and a living spiritual center.</figcaption>
      </figure>
    </section>
